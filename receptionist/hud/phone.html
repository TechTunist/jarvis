<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>J.A.R.V.I.S.</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02060c; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
    #ptt {
      position: fixed; left: 16px; right: 16px;
      bottom: max(24px, env(safe-area-inset-bottom));
      height: 88px;
      z-index: 2147483647;
      -webkit-appearance: none; appearance: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      border: 3px solid #ffcc33;
      background: #c47a00;
      color: #1a1000;
      font: 700 22px/1.1 -apple-system, system-ui, sans-serif;
      letter-spacing: 0.06em;
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(255, 180, 0, 0.55);
    }
    #ptt.hot { background: #ffb020; }
    #msg {
      position: fixed; left: 12px; right: 12px;
      bottom: calc(120px + env(safe-area-inset-bottom));
      text-align: center;
      color: #ffcc33; font: 15px -apple-system, system-ui, sans-serif;
      z-index: 2147483647;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Join the PC hotspot. Hold the button. Allow mic.</div>
<button id="ptt" type="button">HOLD TO TALK</button>
<audio id="out" playsinline webkit-playsinline></audio>
<script>
const C = document.getElementById("c");
const X = C.getContext("2d");
const ptt = document.getElementById("ptt");
const msg = document.getElementById("msg");
const out = document.getElementById("out");
let W = 0, H = 0, t0 = performance.now();
const hud = { state: "idle", level: 0, line: "", name: "J.A.R.V.I.S." };
let rec = null, chunks = [], holding = false, actx = null;

function resize() { W = C.width = innerWidth; H = C.height = innerHeight; }
addEventListener("resize", resize); resize();

async function poll() {
  try { Object.assign(hud, await (await fetch("/state", { cache: "no-store" })).json()); }
  catch (_) {}
}
setInterval(poll, 80); poll();

function col(state) {
  if (state === "listening") return [255, 176, 32];
  if (state === "thinking") return [80, 220, 255];
  if (state === "speaking") return [0, 229, 255];
  return [0, 160, 200];
}
function ring(cx, cy, r, a, w, rgb, spin) {
  X.save(); X.translate(cx, cy); X.rotate(spin);
  X.beginPath(); X.arc(0, 0, r, a, a + Math.PI * 1.4);
  X.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.85)`; X.lineWidth = w; X.stroke();
  X.beginPath(); X.arc(0, 0, r, a + Math.PI * 1.55, a + Math.PI * 1.95); X.stroke();
  X.restore();
}
function hex(cx, cy, r, rgb, a) {
  X.beginPath();
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI / 6 + i * Math.PI / 3;
    const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
    i ? X.lineTo(x, y) : X.moveTo(x, y);
  }
  X.closePath(); X.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; X.lineWidth = 1.5; X.stroke();
}
function label(text, x, y, size, rgb, a = 0.9) {
  X.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
  X.font = `${size}px Consolas, monospace`; X.textAlign = "center"; X.textBaseline = "middle";
  X.fillText(text, x, y);
}
function draw(now) {
  const t = (now - t0) / 1000, rgb = col(hud.state);
  X.fillStyle = "#02060c"; X.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 - 24;
  const pulse = hud.state === "speaking" ? 0.75 + 0.25 * Math.sin(t * 20)
    : hud.state === "listening" ? 0.7 + 0.3 * Math.sin(t * 8)
    : hud.state === "thinking" ? 0.6 + 0.4 * Math.sin(t * 12)
    : 0.5 + 0.5 * Math.sin(t * 1.6);
  const spin = hud.state === "thinking" ? t * 2.2 : hud.state === "listening" ? -t * 1.4 : t * 0.35;
  for (let i = 0; i < 5; i++) ring(cx, cy, 70 + i * 32 + pulse * 6, spin + i * 0.5, 1.2, rgb, spin * 0.15);
  hex(cx, cy, 46 + pulse * 8, rgb, 0.9);
  X.beginPath(); X.arc(cx, cy, 8 + pulse * 4, 0, Math.PI * 2);
  X.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${0.55 + pulse * 0.4})`; X.fill();
  label(hud.name, cx, 44, 22, rgb);
  label((hud.state || "idle").toUpperCase(), cx, H - 150, 16, rgb);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function mime() {
  if (!window.MediaRecorder) return "";
  const opts = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/aac"];
  return opts.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

// Short silent WAV. Keep it looping from the finger-down so Safari still
// allows play() after the slow round-trip to Talk.
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=";

function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    if (!actx) actx = new AC();
    actx.resume().catch(() => {});
    try {
      const silent = actx.createBuffer(1, 1, 22050);
      const src = actx.createBufferSource();
      src.buffer = silent;
      src.connect(actx.destination);
      src.start(0);
    } catch (_) {}
  }
  out.muted = false;
  out.loop = true;
  try {
    if (!out.src || out.src.indexOf("blob:") !== 0) out.src = SILENT_WAV;
    const p = out.play();
    if (p && p.catch) p.catch(() => {});
  } catch (_) {}
}

let cancelHold = false;
let ending = false;
let activePtr = null;

function armRecorder(stream) {
  const t = mime();
  chunks = [];
  rec = t ? new MediaRecorder(stream, { mimeType: t }) : new MediaRecorder(stream);
  rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  try { rec.start(200); } catch (_) { rec.start(); }
  msg.textContent = "Release to send";
}

function startHold(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  if (holding || ending) return;
  if (!window.MediaRecorder) {
    msg.textContent = "This browser cannot record. iOS 14.3+ Safari, use https.";
    return;
  }
  if (!window.isSecureContext) {
    msg.textContent = "Need https (Safari blocks the mic on http).";
    return;
  }
  holding = true;
  cancelHold = false;
  rec = null;
  if (e && e.pointerId != null) {
    activePtr = e.pointerId;
    try { ptt.setPointerCapture(e.pointerId); } catch (_) {}
  }
  ptt.classList.add("hot");
  ptt.textContent = "LISTENING…";
  msg.textContent = "Listening…";
  unlockAudio();
  // Must start in this gesture tick — do not await first.
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    if (cancelHold || !holding) {
      stream.getTracks().forEach((tr) => tr.stop());
      return;
    }
    try {
      armRecorder(stream);
    } catch (err) {
      stream.getTracks().forEach((tr) => tr.stop());
      holding = false;
      rec = null;
      ptt.classList.remove("hot");
      ptt.textContent = "HOLD TO TALK";
      msg.textContent = "Recorder failed: " + err;
    }
  }).catch((err) => {
    holding = false;
    rec = null;
    ptt.classList.remove("hot");
    ptt.textContent = "HOLD TO TALK";
    msg.textContent = "Mic blocked. Allow microphone in Safari. " + err;
  });
}

async function playReply(buf) {
  const url = URL.createObjectURL(new Blob([buf], { type: "audio/mpeg" }));
  out.loop = false;
  out.muted = false;
  out.src = url;
  out.load();
  try {
    await out.play();
    msg.textContent = "Speaking on this phone";
  } catch (err) {
    msg.textContent = "Safari blocked playback. Keep the page open and try again. " + err;
  }
}

function waitMs(ms) {
  return new Promise((res) => setTimeout(res, ms));
}

async function endHold(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
    if (activePtr != null && e.pointerId != null && e.pointerId !== activePtr) return;
  }
  if (!holding || ending) return;
  ending = true;
  unlockAudio();
  ptt.classList.remove("hot");
  ptt.textContent = "THINKING…";
  msg.textContent = "Sending…";
  const t0 = Date.now();
  while (!rec && holding && Date.now() - t0 < 4000) {
    await waitMs(40);
  }
  holding = false;
  activePtr = null;
  if (!rec) {
    cancelHold = true;
    ending = false;
    ptt.textContent = "HOLD TO TALK";
    msg.textContent = "Mic did not start. Tap Allow, then hold again.";
    return;
  }
  const recNow = rec;
  rec = null;
  const blob = await new Promise((res) => {
    const finish = () => {
      try { recNow.stream.getTracks().forEach((tr) => tr.stop()); } catch (_) {}
      res(new Blob(chunks, { type: recNow.mimeType || "audio/mp4" }));
    };
    recNow.onstop = finish;
    try { recNow.requestData && recNow.requestData(); } catch (_) {}
    try { recNow.stop(); } catch (_) { finish(); }
  });
  if (blob.size < 800) {
    ending = false;
    msg.textContent = "Too short — keep holding while you speak.";
    ptt.textContent = "HOLD TO TALK";
    return;
  }
  try {
    const r = await fetch("/utterance", {
      method: "POST",
      body: blob,
      headers: { "Content-Type": blob.type || "audio/mp4" },
    });
    const ctype = (r.headers.get("Content-Type") || "").toLowerCase();
    if (!r.ok) {
      let detail = "Desk error " + r.status;
      if (ctype.includes("json")) {
        try { detail = (await r.json()).error || detail; } catch (_) {}
      }
      msg.textContent = detail;
      ptt.textContent = "HOLD TO TALK";
      ending = false;
      return;
    }
    const buf = await r.arrayBuffer();
    if (!buf.byteLength) {
      msg.textContent = "No audio came back. You should still hear the PC.";
      ptt.textContent = "HOLD TO TALK";
      ending = false;
      return;
    }
    await playReply(buf);
  } catch (err) {
    msg.textContent = "Send failed: " + err;
  }
  ptt.textContent = "HOLD TO TALK";
  ending = false;
}

ptt.addEventListener("pointerdown", startHold);
ptt.addEventListener("pointerup", endHold);
ptt.addEventListener("pointercancel", (e) => {
  // iOS often fires cancel while the finger is still down. Ignore it.
  if (e) e.preventDefault();
});

out.addEventListener("play", () => { msg.textContent = "Speaking"; });
</script>
</body>
</html>
