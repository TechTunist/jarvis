<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>J.A.R.V.I.S.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #01040a; overflow: hidden; cursor: none; }
    #c { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed; inset: 0; pointer-events: none;
      font-family: "Eurostile", "Orbitron", "Segoe UI", system-ui, sans-serif;
      color: #7eeeff; text-shadow: 0 0 18px rgba(0, 220, 255, 0.45);
    }
    #name {
      position: absolute; top: 7vh; left: 0; right: 0; text-align: center;
      font-size: clamp(22px, 3.2vw, 42px); letter-spacing: 0.55em; font-weight: 600;
    }
    #state {
      position: absolute; bottom: 11vh; left: 0; right: 0; text-align: center;
      font-size: clamp(13px, 1.6vw, 20px); letter-spacing: 0.42em;
    }
    #line {
      position: absolute; bottom: 6.5vh; left: 8vw; right: 8vw; text-align: center;
      font-size: clamp(12px, 1.4vw, 16px); letter-spacing: 0.12em;
      opacity: 0.75; min-height: 1.4em;
    }
    #hint {
      position: absolute; bottom: 2.8vh; left: 0; right: 0; text-align: center;
      font-size: 11px; letter-spacing: 0.35em; opacity: 0.4;
    }
    .corner {
      position: absolute; width: 54px; height: 54px; border: 1.5px solid rgba(0, 220, 255, 0.35);
    }
    .tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; }
    .tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; }
    .bl { bottom: 22px; left: 22px; border-right: 0; border-top: 0; }
    .br { bottom: 22px; right: 22px; border-left: 0; border-top: 0; }
    #scan {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 2px,
        rgba(0, 10, 20, 0.12) 3px
      );
      mix-blend-mode: overlay; opacity: 0.35;
    }
    body.listening #ui { color: #ffb020; text-shadow: 0 0 18px rgba(255, 176, 32, 0.5); }
    body.listening .corner { border-color: rgba(255, 176, 32, 0.45); }
    body.thinking #ui { color: #50dcff; }
    body.speaking #ui { color: #00f3ff; text-shadow: 0 0 22px rgba(0, 243, 255, 0.65); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="scan"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="name">J.A.R.V.I.S.</div>
  <div id="state">IDLE</div>
  <div id="line"></div>
  <div id="hint">HOLD HOME TO SPEAK&nbsp;&nbsp;·&nbsp;&nbsp;F FULLSCREEN</div>
</div>
<script type="module" src="./hud.js"></script>
</body>
</html>
